name: deploy

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx vite build --base=/$(basename ${GITHUB_REPOSITORY})/

      - name: Disable Jekyll
        run: touch ./docs/.nojekyll

      - name: Copy index.html as 404 page
        run: cp ./docs/index.html ./docs/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
